services:
  mysql:
    image: 'mysql:8.0'
    container_name: fitness-mysql
    environment:
      MYSQL_DATABASE: fitness_nutrition_db
      MYSQL_USER: fitness_user
      MYSQL_PASSWORD: fitness_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: fitness-app
    ports:
      - '8080:8080'
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
