services:
  mysql:
    image: 'mysql:8.0'
    container_name: fitness-mysql
    environment:
      MYSQL_DATABASE: fitness_nutrition_db
      MYSQL_USER: fitness_user
      MYSQL_PASSWORD: fitness_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Run with: docker compose --profile docker-app up --build
  # Default `docker compose up` / Spring Boot Docker Compose only starts MySQL (local dev: mvnw defaults to port 8082).
  app:
    profiles:
      - docker-app
    build: .
    container_name: fitness-app
    # Host 8082 → container 8080 (same URL as local: .\mvnw spring-boot:run — session + chat + cart share one origin)
    ports:
      - '8082:8080'
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Chat/Gemini: set GEMINI_API_KEY in a local .env file (see .gitignore) or export before compose up
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
