# Optional local overrides (API keys, etc.). Create application-local.properties — gitignored.
spring.config.import=optional:classpath:application-local.properties

# Application
spring.application.name=j2ee-fitness-nutrition-ecommerce
# Single origin for browser session, CSRF, and chat → cart: always use http://localhost:8082 (override only if you know why)
server.port=${SERVER_PORT:8082}

# Start MySQL from compose.yaml by default (only the mysql service; app uses profile docker-app).
# Pure XAMPP / no Docker: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=xampp
spring.docker.compose.enabled=true
spring.docker.compose.lifecycle-management=start-and-stop

# MySQL Datasource (local development)
spring.datasource.url=jdbc:mysql://localhost:3306/fitness_nutrition_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=fitness_user
spring.datasource.password=fitness_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Session
server.servlet.session.timeout=30m

# Google OAuth2 (set GOOGLE_* env vars for real Google login; placeholders satisfy Boot validation for local UI)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-dev-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-dev-placeholder}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# File upload size limit
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Upload directory
app.upload.dir=./uploads/

# Mail (Gmail SMTP — set MAIL_* env vars for real sends; defaults allow local startup without .env)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@fitshop.com}

# Gemini AI Agent
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.api.timeout-seconds=30
gemini.chat.max-history=20
gemini.chat.rate-limit-per-minute=20
