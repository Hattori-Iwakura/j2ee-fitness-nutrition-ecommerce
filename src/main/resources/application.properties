# Application
spring.application.name=j2ee-fitness-nutrition-ecommerce
# Override when 8080 is taken (e.g. Docker app): PowerShell: $env:SERVER_PORT=8082; .\mvnw.cmd spring-boot:run
server.port=${SERVER_PORT:8080}

# Start MySQL from compose.yaml by default (only the mysql service; app uses profile docker-app).
# Pure XAMPP / no Docker: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=xampp
spring.docker.compose.enabled=true

# MySQL Datasource (local development)
spring.datasource.url=jdbc:mysql://localhost:3306/fitness_nutrition_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=fitness_user
spring.datasource.password=fitness_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Session
server.servlet.session.timeout=30m

# File upload size limit
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Upload directory
app.upload.dir=./uploads/

# Seed 30 demo orders (DEMO-SEED-001..030) for admin UI — skipped if already present. Disabled in tests.
app.demo-orders-seed.enabled=true

# Mail (Gmail SMTP - configure with your credentials)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@fitshop.com}
