<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('Products - FitShop')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container mt-4">
    <div class="row">
        <!-- Sidebar: Filters -->
        <div class="col-md-3">
            <form th:action="@{/products}" method="get" id="filterForm">
                <!-- Categories -->
                <div class="card mb-3">
                    <div class="card-header bg-dark text-white">Categories</div>
                    <div class="list-group list-group-flush">
                        <a th:href="@{/products}" class="list-group-item list-group-item-action"
                           th:classappend="${filter.category == null or filter.category.isBlank()} ? 'active'">All Products</a>
                        <a th:each="cat : ${categories}"
                           th:href="@{/products(category=${cat.slug})}"
                           class="list-group-item list-group-item-action"
                           th:classappend="${currentCategory != null and currentCategory.id == cat.id} ? 'active'"
                           th:text="${cat.name}">Category</a>
                    </div>
                </div>

                <!-- Preserve category in filter form -->
                <input type="hidden" name="category" th:value="${filter.category}">

                <!-- Search -->
                <div class="card mb-3">
                    <div class="card-header bg-dark text-white">Search</div>
                    <div class="card-body">
                        <div class="input-group">
                            <input type="text" class="form-control" name="keyword" th:value="${filter.keyword}" placeholder="Search products...">
                            <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i></button>
                        </div>
                    </div>
                </div>

                <!-- Price Range -->
                <div class="card mb-3">
                    <div class="card-header bg-dark text-white">Price Range</div>
                    <div class="card-body">
                        <div class="row g-2">
                            <div class="col-6">
                                <input type="number" class="form-control form-control-sm" name="minPrice"
                                       th:value="${filter.minPrice}" placeholder="Min" min="0">
                            </div>
                            <div class="col-6">
                                <input type="number" class="form-control form-control-sm" name="maxPrice"
                                       th:value="${filter.maxPrice}" placeholder="Max" min="0">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Brand Filter -->
                <div class="card mb-3" th:if="${allBrands != null and !allBrands.isEmpty()}">
                    <div class="card-header bg-dark text-white">Brand</div>
                    <div class="card-body" style="max-height: 200px; overflow-y: auto;">
                        <div class="form-check" th:each="brand : ${allBrands}">
                            <input class="form-check-input" type="checkbox" name="brands"
                                   th:value="${brand}" th:id="'brand-' + ${brand}"
                                   th:checked="${filter.brands != null and filter.brands.contains(brand)}">
                            <label class="form-check-label" th:for="'brand-' + ${brand}" th:text="${brand}">Brand</label>
                        </div>
                    </div>
                </div>

                <!-- In Stock Only -->
                <div class="card mb-3">
                    <div class="card-body">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" name="inStockOnly"
                                   id="inStockOnly" value="true" th:checked="${filter.inStockOnly}">
                            <label class="form-check-label" for="inStockOnly">In Stock Only</label>
                        </div>
                    </div>
                </div>

                <!-- Apply / Clear Filters -->
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-funnel"></i> Apply Filters
                    </button>
                    <a th:href="@{/products}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle"></i> Clear All
                    </a>
                </div>
            </form>
        </div>

        <!-- Product Grid -->
        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h2 th:if="${currentCategory != null}" th:text="${currentCategory.name}">Products</h2>
                    <h2 th:if="${filter.keyword != null and !filter.keyword.isBlank()}">Search: "<span th:text="${filter.keyword}"></span>"</h2>
                    <h2 th:if="${(currentCategory == null) and (filter.keyword == null or filter.keyword.isBlank())}">All Products</h2>
                    <small class="text-muted" th:text="${products.totalElements} + ' product(s) found'">N products found</small>
                </div>

                <!-- Sort Dropdown -->
                <div class="d-flex align-items-center gap-2">
                    <label for="sortSelect" class="form-label mb-0 text-nowrap">Sort by:</label>
                    <select class="form-select form-select-sm" id="sortSelect" style="width: auto;"
                            onchange="applySort(this.value)">
                        <option value="newest" th:selected="${filter.sort == null or filter.sort == 'newest'}">Newest</option>
                        <option value="price-asc" th:selected="${filter.sort == 'price-asc'}">Price: Low to High</option>
                        <option value="price-desc" th:selected="${filter.sort == 'price-desc'}">Price: High to Low</option>
                        <option value="name-asc" th:selected="${filter.sort == 'name-asc'}">Name: A-Z</option>
                        <option value="name-desc" th:selected="${filter.sort == 'name-desc'}">Name: Z-A</option>
                    </select>
                </div>
            </div>

            <!-- Active Filters Tags -->
            <div class="mb-3" th:if="${(filter.brands != null and !filter.brands.isEmpty()) or filter.minPrice != null or filter.maxPrice != null or filter.inStockOnly}">
                <span class="badge bg-secondary me-1" th:each="b : ${filter.brands}" th:text="'Brand: ' + ${b}">Brand</span>
                <span class="badge bg-secondary me-1" th:if="${filter.minPrice != null}" th:text="'Min: ' + ${#numbers.formatDecimal(filter.minPrice, 0, 'COMMA', 0, 'POINT')} + ' VND'">Min</span>
                <span class="badge bg-secondary me-1" th:if="${filter.maxPrice != null}" th:text="'Max: ' + ${#numbers.formatDecimal(filter.maxPrice, 0, 'COMMA', 0, 'POINT')} + ' VND'">Max</span>
                <span class="badge bg-success me-1" th:if="${filter.inStockOnly}">In Stock</span>
                <a th:href="@{/products(category=${filter.category})}" class="badge bg-danger text-decoration-none">Clear filters</a>
            </div>

            <div class="row g-4" th:if="${!products.isEmpty()}">
                <div class="col-md-4" th:each="product : ${products}">
                    <div class="card h-100 shadow-sm position-relative">
                        <!-- Wishlist heart -->
                        <div sec:authorize="isAuthenticated()" class="position-absolute top-0 end-0 m-2" style="z-index: 1;">
                            <form th:if="${wishlistedIds != null and wishlistedIds.contains(product.id)}" th:action="@{/wishlist/remove}" method="post">
                                <input type="hidden" name="productId" th:value="${product.id}">
                                <button type="submit" class="btn btn-sm btn-light rounded-circle shadow-sm" title="Remove from wishlist">
                                    <i class="bi bi-heart-fill text-danger"></i>
                                </button>
                            </form>
                            <form th:if="${wishlistedIds == null or !wishlistedIds.contains(product.id)}" th:action="@{/wishlist/add}" method="post">
                                <input type="hidden" name="productId" th:value="${product.id}">
                                <button type="submit" class="btn btn-sm btn-light rounded-circle shadow-sm" title="Add to wishlist">
                                    <i class="bi bi-heart"></i>
                                </button>
                            </form>
                        </div>
                        <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}" class="card-img-top" style="height: 200px; object-fit: cover;" alt="Product image">
                        <div th:if="${product.imageUrl == null}" class="text-center p-4 bg-light">
                            <i class="bi bi-box-seam display-4 text-muted"></i>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                            <p class="text-muted small" th:text="${product.brand}">Brand</p>
                            <p class="card-text flex-grow-1" th:text="${#strings.abbreviate(product.description, 100)}">Description</p>
                            <div class="mt-auto">
                                <p class="fw-bold text-primary" th:if="${!product.variants.isEmpty()}"
                                   th:text="'From ' + ${#numbers.formatDecimal(product.variants[0].price, 0, 'COMMA', 0, 'POINT')} + ' VND'">Price</p>
                                <a th:href="@{/products/{slug}(slug=${product.slug})}" class="btn btn-outline-primary w-100">View Details</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${products.isEmpty()}" class="text-center py-5">
                <i class="bi bi-search display-4 text-muted"></i>
                <p class="text-muted fs-5 mt-3">No products match your filters.</p>
                <a th:href="@{/products}" class="btn btn-outline-primary">Clear all filters</a>
            </div>

            <!-- Pagination -->
            <nav th:if="${products.totalPages > 1}" class="mt-4">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                        <a class="page-link page-nav" href="#" th:data-page="${products.number - 1}">Previous</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                        th:classappend="${i == products.number} ? 'active'">
                        <a class="page-link page-nav" href="#" th:data-page="${i}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                        <a class="page-link page-nav" href="#" th:data-page="${products.number + 1}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>

<script>
    function ensureHiddenInput(form, name, value) {
        let input = form.querySelector('input[type="hidden"][name="' + name + '"]');
        if (!input) {
            input = document.createElement('input');
            input.type = 'hidden';
            input.name = name;
            form.appendChild(input);
        }
        input.value = value;
    }

    function applySort(value) {
        var form = document.getElementById('filterForm');
        ensureHiddenInput(form, 'sort', value);
        form.submit();
    }

    document.querySelectorAll('.page-nav').forEach(function(link) {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            if (this.closest('.page-item').classList.contains('disabled') ||
                this.closest('.page-item').classList.contains('active')) return;
            var form = document.getElementById('filterForm');
            ensureHiddenInput(form, 'page', this.dataset.page);
            ensureHiddenInput(form, 'sort', document.getElementById('sortSelect').value);
            form.submit();
        });
    });
</script>
</body>
</html>
