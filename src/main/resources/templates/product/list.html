<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Products - FitShop')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container mt-4">
    <div class="row">
        <!-- Sidebar: Categories -->
        <div class="col-md-3">
            <div class="card mb-4">
                <div class="card-header bg-dark text-white">Categories</div>
                <div class="list-group list-group-flush">
                    <a th:href="@{/products}" class="list-group-item list-group-item-action"
                       th:classappend="${currentCategory == null and keyword == null} ? 'active'">All Products</a>
                    <a th:each="cat : ${categories}" th:href="@{/products(category=${cat.slug})}"
                       class="list-group-item list-group-item-action"
                       th:classappend="${currentCategory != null and currentCategory.id == cat.id} ? 'active'"
                       th:text="${cat.name}">Category</a>
                </div>
            </div>
            <!-- Search -->
            <div class="card">
                <div class="card-header bg-dark text-white">Search</div>
                <div class="card-body">
                    <form th:action="@{/products}" method="get">
                        <div class="input-group">
                            <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Search products...">
                            <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i></button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Product Grid -->
        <div class="col-md-9">
            <h2 th:if="${currentCategory != null}" th:text="${currentCategory.name}">Products</h2>
            <h2 th:if="${keyword != null}">Search results for: "<span th:text="${keyword}"></span>"</h2>
            <h2 th:if="${currentCategory == null and keyword == null}">All Products</h2>

            <div class="row g-4" th:if="${!products.isEmpty()}">
                <div class="col-md-4" th:each="product : ${products}">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                            <p class="text-muted small" th:text="${product.brand}">Brand</p>
                            <p class="card-text flex-grow-1" th:text="${#strings.abbreviate(product.description, 100)}">Description</p>
                            <div class="mt-auto">
                                <p class="fw-bold text-primary" th:if="${!product.variants.isEmpty()}"
                                   th:text="'From ' + ${#numbers.formatDecimal(product.variants[0].price, 0, 'COMMA', 0, 'POINT')} + ' VND'">Price</p>
                                <a th:href="@{/products/{slug}(slug=${product.slug})}" class="btn btn-outline-primary w-100">View Details</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${products.isEmpty()}" class="text-center py-5">
                <p class="text-muted fs-5">No products found.</p>
            </div>

            <!-- Pagination -->
            <nav th:if="${products.totalPages > 1}" class="mt-4">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/products(page=${products.number - 1}, category=${category}, keyword=${keyword})}">Previous</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                        th:classappend="${i == products.number} ? 'active'">
                        <a class="page-link" th:href="@{/products(page=${i}, category=${category}, keyword=${keyword})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/products(page=${products.number + 1}, category=${category}, keyword=${keyword})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
