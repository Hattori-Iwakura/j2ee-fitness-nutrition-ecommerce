<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Login - FitShop')}"></head>
<body class="fitshop-edge-decor">
<th:block th:replace="~{fragments/edge-decor :: edgeDecor}"></th:block>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container fitshop-page fitshop-auth-page fitshop-edge-layer">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-10 col-md-7 col-lg-5 col-xl-4">
            <div class="card fitshop-auth-panel border-0">
                <div class="card-body px-4 px-md-5 py-4 py-md-5">
                    <div class="text-center mb-4">
                        <div class="fitshop-auth-icon-wrap mx-auto mb-3" aria-hidden="true">
                            <i class="bi bi-person-badge"></i>
                        </div>
                        <p class="fitshop-auth-eyebrow mb-2">Welcome back</p>
                        <h1 class="h3 fitshop-auth-title mb-2">Sign in</h1>
                        <p class="fitshop-auth-lead text-muted small mb-0">Enter your email and password to access your account.</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger fitshop-auth-alert d-flex align-items-start gap-2 mb-4" role="alert">
                        <i class="bi bi-exclamation-circle flex-shrink-0 mt-1"></i>
                        <span>Invalid email or password.</span>
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info fitshop-auth-alert d-flex align-items-start gap-2 mb-4" role="status">
                        <i class="bi bi-info-circle flex-shrink-0 mt-1"></i>
                        <span>You have been logged out.</span>
                    </div>
                    <div th:if="${success}" class="alert alert-success fitshop-auth-alert d-flex align-items-start gap-2 mb-4" role="status">
                        <i class="bi bi-check-circle flex-shrink-0 mt-1"></i>
                        <span th:text="${success}">Success</span>
                    </div>

                    <form th:action="@{/login}" method="post" class="fitshop-auth-form">
                        <div class="mb-3">
                            <label for="username" class="form-label fitshop-auth-label">Email</label>
                            <div class="input-group fitshop-auth-input-group">
                                <span class="input-group-text"><i class="bi bi-envelope" aria-hidden="true"></i></span>
                                <input type="email" class="form-control form-control-lg" id="username" name="username"
                                       placeholder="you@example.com" autocomplete="email" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fitshop-auth-label">Password</label>
                            <div class="input-group fitshop-auth-input-group">
                                <span class="input-group-text"><i class="bi bi-lock" aria-hidden="true"></i></span>
                                <input type="password" class="form-control form-control-lg" id="password" name="password"
                                       placeholder="••••••••" autocomplete="current-password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 fitshop-auth-submit">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Sign in
                        </button>
                    </form>

                    <div class="text-center my-3">
                        <span class="text-muted">or</span>
                    </div>

                    <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48" class="me-2">
                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                        </svg>
                        Login with Google
                    </a>

                    <p class="text-center fitshop-auth-footer-text mt-4 mb-0">
                        Don&apos;t have an account?
                        <a th:href="@{/register}" class="fitshop-auth-link">Create one</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
