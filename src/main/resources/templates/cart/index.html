<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Shopping Cart - FitShop')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container fitshop-page">
    <p class="fitshop-eyebrow mb-1" style="color: var(--fs-accent);">Checkout</p>
    <h2 class="fitshop-section-title"><i class="bi bi-cart3"></i> Shopping Cart</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div th:if="${cartItems.isEmpty()}" class="text-center py-5">
        <i class="bi bi-cart-x display-1 text-muted"></i>
        <p class="fs-5 text-muted mt-3">Your cart is empty</p>
        <a th:href="@{/products}" class="btn btn-primary">Browse Products</a>
    </div>

    <div th:if="${!cartItems.isEmpty()}">
        <table class="table table-hover fitshop-table rounded overflow-hidden">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Variant</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${cartItems}">
                    <td th:text="${item.productName}">Product</td>
                    <td>
                        <span th:text="${item.flavor}">Flavor</span> -
                        <span th:text="${item.weight}">Weight</span>
                    </td>
                    <td th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' VND'">Price</td>
                    <td>
                        <form th:action="@{/cart/update}" method="post" class="d-flex align-items-center gap-1">
                            <input type="hidden" name="variantId" th:value="${item.variantId}">
                            <input type="number" class="form-control form-control-sm" name="quantity"
                                   th:value="${item.quantity}" min="1" max="99" style="width: 65px;">
                            <button type="submit" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-repeat"></i></button>
                        </form>
                    </td>
                    <td class="fw-bold" th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + ' VND'">Subtotal</td>
                    <td>
                        <form th:action="@{/cart/remove}" method="post">
                            <input type="hidden" name="variantId" th:value="${item.variantId}">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="4" class="text-end fw-bold fs-5">Total:</td>
                    <td class="fw-bold fs-5 text-primary" th:text="${#numbers.formatDecimal(cartTotal, 0, 'COMMA', 0, 'POINT')} + ' VND'">Total</td>
                    <td></td>
                </tr>
            </tfoot>
        </table>

        <div class="d-flex justify-content-between">
            <form th:action="@{/cart/clear}" method="post">
                <button type="submit" class="btn btn-outline-danger">Clear Cart</button>
            </form>
            <a th:href="@{/checkout}" class="btn btn-primary btn-lg">
                <i class="bi bi-credit-card"></i> Proceed to Checkout
            </a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
