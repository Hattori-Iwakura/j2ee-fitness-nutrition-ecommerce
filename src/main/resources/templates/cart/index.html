<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Shopping Cart - FitShop')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container fitshop-page">
    <p class="fitshop-eyebrow mb-1" style="color: var(--fs-accent);">Checkout</p>
    <h2 class="fitshop-section-title"><i class="bi bi-cart3"></i> Shopping Cart</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div th:if="${cartItems.isEmpty()}" class="fitshop-empty-state text-center">
        <i class="bi bi-cart-x display-1 text-muted"></i>
        <p class="fs-5 text-muted mt-3 mb-0">Your cart is empty</p>
        <a th:href="@{/products}" class="btn btn-primary mt-3">Browse products</a>
    </div>

    <div th:if="${!cartItems.isEmpty()}">
        <div class="table-responsive fitshop-table-responsive-wrap mb-4">
            <table class="table table-hover fitshop-table mb-0">
                <thead>
                    <tr>
                        <th class="d-none d-md-table-cell" style="width: 72px;"><span class="visually-hidden">Image</span></th>
                        <th>Product</th>
                        <th>Variant</th>
                        <th class="text-nowrap">Price</th>
                        <th style="min-width: 8rem;">Qty</th>
                        <th class="text-nowrap">Subtotal</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${cartItems}">
                        <td class="d-none d-md-table-cell align-middle">
                            <img th:if="${item.imageUrl != null}" th:src="${item.imageUrl}" alt="" class="fitshop-cart-thumb">
                            <div th:if="${item.imageUrl == null}" class="fitshop-cart-thumb bg-light d-flex align-items-center justify-content-center">
                                <i class="bi bi-box-seam text-muted"></i>
                            </div>
                        </td>
                        <td class="align-middle fw-semibold" th:text="${item.productName}">Product</td>
                        <td class="align-middle small text-muted">
                            <span th:text="${item.flavor}">Flavor</span>
                            <span> · </span>
                            <span th:text="${item.weight}">Weight</span>
                        </td>
                        <td class="align-middle text-nowrap" th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' VND'">Price</td>
                        <td class="align-middle">
                            <form th:action="@{/cart/update}" method="post" class="d-flex align-items-center gap-1 flex-nowrap">
                                <input type="hidden" name="variantId" th:value="${item.variantId}">
                                <input type="number" class="form-control form-control-sm" name="quantity"
                                       th:value="${item.quantity}" min="1" max="99" style="width: 4rem;" aria-label="Quantity">
                                <button type="submit" class="btn btn-sm btn-outline-secondary flex-shrink-0" title="Update quantity"><i class="bi bi-arrow-repeat"></i></button>
                            </form>
                        </td>
                        <td class="align-middle fw-bold text-nowrap fitshop-price-display fs-6" th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + ' VND'">Subtotal</td>
                        <td class="align-middle text-end">
                            <form th:action="@{/cart/remove}" method="post" class="d-inline">
                                <input type="hidden" name="variantId" th:value="${item.variantId}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Remove"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-end align-items-center gap-3 mb-4 px-3 py-3 fitshop-summary-bar" style="margin-top: -1px;">
            <span class="fw-bold fs-5 mb-0">Total</span>
            <span class="fs-4 fw-bold fitshop-price-display text-nowrap" th:text="${#numbers.formatDecimal(cartTotal, 0, 'COMMA', 0, 'POINT')} + ' VND'">Total</span>
        </div>

        <div class="d-flex flex-wrap fitshop-cart-actions justify-content-between align-items-center">
            <form th:action="@{/cart/clear}" method="post">
                <button type="submit" class="btn btn-outline-danger">Clear cart</button>
            </form>
            <a th:href="@{/checkout}" class="btn btn-primary btn-lg d-inline-flex align-items-center gap-2">
                <i class="bi bi-credit-card"></i> Proceed to checkout
            </a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
