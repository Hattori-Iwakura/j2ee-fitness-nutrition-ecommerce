<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('404 - Page Not Found')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container mt-5">
    <div class="text-center py-5">
        <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 5rem;"></i>
        <h1 class="display-1 fw-bold text-muted mt-3">404</h1>
        <h2 class="mb-3">Page Not Found</h2>
        <p class="text-muted mb-4">The page you are looking for does not exist or has been moved.</p>
        <div class="d-flex justify-content-center gap-3">
            <a th:href="@{/}" class="btn btn-primary btn-lg">
                <i class="bi bi-house-door"></i> Back to Home
            </a>
            <a th:href="@{/products}" class="btn btn-outline-primary btn-lg">
                <i class="bi bi-bag"></i> Browse Products
            </a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
