<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Order Placed - FitShop')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container mt-5">
    <div class="text-center">
        <i class="bi bi-check-circle-fill text-success display-1"></i>
        <h2 class="mt-3">Order Placed Successfully!</h2>
        <p class="fs-5">Your order code: <strong class="text-primary" th:text="${order.orderCode}">FS-XXXXXXXX</strong></p>
        <p class="text-muted">Total: <strong th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'">Amount</strong></p>
        <p th:if="${order.payment != null}" class="text-muted">
            Payment: <span class="badge" th:classappend="${order.payment.paymentStatus.name() == 'COMPLETED'} ? 'bg-success' : (${order.payment.paymentStatus.name() == 'PENDING'} ? 'bg-warning text-dark' : 'bg-danger')" th:text="${order.payment.paymentStatus}">Status</span>
            via <strong th:text="${order.payment.paymentMethod}">Method</strong>
        </p>
        <div class="mt-4">
            <a th:href="@{/orders}" class="btn btn-primary me-2">View My Orders</a>
            <a th:href="@{/products}" class="btn btn-outline-secondary">Continue Shopping</a>
        </div>
    </div>

    <!-- Cross-sell recommendations -->
    <div class="mt-5" th:if="${crossSellProducts != null and !crossSellProducts.isEmpty()}">
        <h4>You Might Also Like</h4>
        <div class="row row-cols-1 row-cols-md-4 g-3 mt-2">
            <div class="col" th:each="product : ${crossSellProducts}">
                <div class="card h-100">
                    <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}" class="card-img-top" style="height: 180px; object-fit: cover;" alt="Product image">
                    <div th:if="${product.imageUrl == null}" class="card-body text-center bg-light" style="height: 180px; display: flex; align-items: center; justify-content: center;">
                        <i class="bi bi-box-seam display-4 text-muted"></i>
                    </div>
                    <div class="card-body">
                        <h6 class="card-title mb-1">
                            <a th:href="@{/products/{slug}(slug=${product.slug})}" class="text-decoration-none" th:text="${product.name}">Product</a>
                        </h6>
                        <small class="text-muted" th:text="${product.brand}">Brand</small>
                        <div class="mt-2" th:if="${!product.variants.isEmpty()}">
                            <strong class="text-primary" th:text="${#numbers.formatDecimal(product.variants[0].price, 0, 'COMMA', 0, 'POINT')} + ' VND'">Price</strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
