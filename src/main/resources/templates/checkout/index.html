<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Checkout - FitShop')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container fitshop-page">
    <p class="fitshop-eyebrow mb-1" style="color: var(--fs-accent);">Checkout</p>
    <h2 class="fitshop-section-title"><i class="bi bi-credit-card me-2"></i>Shipping &amp; payment</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="card fitshop-card border-0 h-100">
                <div class="card-header fitshop-card-header border-0 rounded-0">Shipping information</div>
                <div class="card-body p-4">
                    <form th:action="@{/checkout}" th:object="${checkoutRequest}" method="post">
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="fullName" th:field="*{fullName}"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="text" class="form-control" id="phone" th:field="*{phone}"
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="address" class="form-label">Address</label>
                            <textarea class="form-control" id="address" rows="3" th:field="*{address}"
                                      th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="note" class="form-label">Note (optional)</label>
                            <textarea class="form-control" id="note" rows="2" th:field="*{note}"></textarea>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold mb-3">Payment method</label>
                            <div class="form-check fitshop-payment-option">
                                <input class="form-check-input" type="radio" name="paymentMethod" id="pm-cod" value="COD" checked>
                                <label class="form-check-label w-100 ps-1" for="pm-cod">
                                    <i class="bi bi-cash-coin me-2"></i> Cash on delivery (COD)
                                </label>
                            </div>
                            <div class="form-check fitshop-payment-option">
                                <input class="form-check-input" type="radio" name="paymentMethod" id="pm-bank" value="BANK_TRANSFER">
                                <label class="form-check-label w-100 ps-1" for="pm-bank">
                                    <i class="bi bi-bank me-2"></i> Bank transfer
                                </label>
                            </div>
                            <div class="form-check fitshop-payment-option">
                                <input class="form-check-input" type="radio" name="paymentMethod" id="pm-ewallet" value="E_WALLET">
                                <label class="form-check-label w-100 ps-1" for="pm-ewallet">
                                    <i class="bi bi-wallet2 me-2"></i> E-wallet
                                </label>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 d-inline-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-check-circle"></i> Place order
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card fitshop-card fitshop-summary-card border-0 sticky-lg-top fitshop-sticky-summary">
                <div class="card-header fitshop-card-header border-0 rounded-0">Order summary</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-start gap-2 py-3" th:each="item : ${cartItems}">
                        <div class="min-w-0">
                            <strong class="d-block" th:text="${item.productName}">Product</strong>
                            <small class="text-muted" th:text="${item.flavor} + ' · ' + ${item.weight} + ' × ' + ${item.quantity}">Variant</small>
                        </div>
                        <span class="fw-semibold text-nowrap fitshop-price-display fs-6" th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + ' VND'">Subtotal</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between py-3">
                        <span class="text-muted">Subtotal</span>
                        <strong th:text="${#numbers.formatDecimal(cartTotal, 0, 'COMMA', 0, 'POINT')} + ' VND'">Subtotal</strong>
                    </li>
                    <li class="list-group-item py-3" th:if="${discount != null}">
                        <div class="d-flex justify-content-between text-success">
                            <span>Discount (<span th:text="${couponCode}">CODE</span>)</span>
                            <span th:text="'-' + ${#numbers.formatDecimal(discount, 0, 'COMMA', 0, 'POINT')} + ' VND'">-50,000 VND</span>
                        </div>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center py-3 fs-5 bg-light">
                        <strong>Total</strong>
                        <strong class="fitshop-price-display" th:text="${#numbers.formatDecimal(finalTotal != null ? finalTotal : cartTotal, 0, 'COMMA', 0, 'POINT')} + ' VND'">Total</strong>
                    </li>
                </ul>
                <div class="card-body border-top fitshop-divider-top">
                    <div th:if="${couponError}" class="alert alert-danger small mb-2" th:text="${couponError}"></div>
                    <div th:if="${success}" class="alert alert-success small mb-2" th:text="${success}"></div>
                    <div th:if="${couponCode != null}">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="badge bg-success"><i class="bi bi-ticket-perforated"></i> <span th:text="${couponCode}">CODE</span></span>
                            <form th:action="@{/checkout/remove-coupon}" method="post">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
                            </form>
                        </div>
                    </div>
                    <form th:if="${couponCode == null}" th:action="@{/checkout/apply-coupon}" method="post">
                        <div class="input-group">
                            <input type="text" class="form-control" name="couponCode" placeholder="Coupon code" required>
                            <button type="submit" class="btn btn-outline-primary">Apply</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
