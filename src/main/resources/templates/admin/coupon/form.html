<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Coupon Form - Admin')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <div class="flex-grow-1 p-4">
        <h2 th:text="${coupon.id != null} ? 'Edit Coupon' : 'New Coupon'">Coupon Form</h2>
        <div class="card mt-3">
            <div class="card-body">
                <form th:action="@{/admin/coupons/save}" th:object="${coupon}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Code</label>
                            <input type="text" class="form-control" th:field="*{code}" th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'" required style="text-transform: uppercase;">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Discount Type</label>
                            <select class="form-select" th:field="*{discountType}" th:classappend="${#fields.hasErrors('discountType')} ? 'is-invalid'" required>
                                <option th:each="type : ${discountTypes}" th:value="${type}" th:text="${type}">Type</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('discountType')}" th:errors="*{discountType}"></div>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Discount Value</label>
                            <input type="number" class="form-control" th:field="*{discountValue}" th:classappend="${#fields.hasErrors('discountValue')} ? 'is-invalid'" step="0.01" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('discountValue')}" th:errors="*{discountValue}"></div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Min Order Amount (VND)</label>
                            <input type="number" class="form-control" th:field="*{minOrderAmount}" th:classappend="${#fields.hasErrors('minOrderAmount')} ? 'is-invalid'" step="0.01">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('minOrderAmount')}" th:errors="*{minOrderAmount}"></div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Max Uses</label>
                            <input type="number" class="form-control" th:field="*{maxUses}" th:classappend="${#fields.hasErrors('maxUses')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('maxUses')}" th:errors="*{maxUses}"></div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Current Uses</label>
                            <input type="number" class="form-control" th:field="*{currentUses}" readonly>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Start Date</label>
                            <input type="datetime-local" class="form-control" th:field="*{startDate}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">End Date</label>
                            <input type="datetime-local" class="form-control" th:field="*{endDate}">
                        </div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" th:field="*{active}" id="active">
                        <label class="form-check-label" for="active">Active</label>
                    </div>
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a th:href="@{/admin/coupons}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
