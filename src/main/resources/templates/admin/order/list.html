<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Orders - Admin')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <div class="flex-grow-1 p-4">
        <h2>Orders</h2>
        <div th:if="${success}" class="alert alert-success mt-3" th:text="${success}"></div>
        <table class="table table-hover mt-3">
            <thead class="table-dark">
                <tr><th>Code</th><th>Customer</th><th>Phone</th><th>Total</th><th>Status</th><th>Date</th><th>Actions</th></tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.orderCode}">Code</td>
                    <td th:text="${order.fullName}">Name</td>
                    <td th:text="${order.phone}">Phone</td>
                    <td th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'">Total</td>
                    <td>
                        <span class="badge"
                              th:classappend="${order.status.name() == 'PENDING'} ? 'bg-warning text-dark' :
                                              (${order.status.name() == 'CONFIRMED'} ? 'bg-info' :
                                              (${order.status.name() == 'SHIPPING'} ? 'bg-primary' :
                                              (${order.status.name() == 'DELIVERED'} ? 'bg-success' : 'bg-danger')))"
                              th:text="${order.status}">Status</span>
                    </td>
                    <td th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">Date</td>
                    <td>
                        <a th:href="@{/admin/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary">Details</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <p th:if="${orders.isEmpty()}" class="text-muted text-center mt-4">No orders yet.</p>
    </div>
</div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
