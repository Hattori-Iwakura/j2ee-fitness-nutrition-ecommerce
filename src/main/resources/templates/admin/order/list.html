<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Orders - Admin')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <div class="flex-grow-1 p-4">
        <h2>Orders</h2>
        <div th:if="${success}" class="alert alert-success mt-3" th:text="${success}"></div>

        <!-- Status Filter + Export -->
        <div class="d-flex gap-2 mt-3 mb-3 align-items-center">
            <a th:href="@{/admin/orders}" class="btn btn-sm"
               th:classappend="${currentStatus == null} ? 'btn-dark' : 'btn-outline-dark'">All</a>
            <a th:each="s : ${statuses}" th:href="@{/admin/orders(status=${s.name()})}"
               class="btn btn-sm"
               th:classappend="${currentStatus != null and currentStatus.name() == s.name()} ? 'btn-dark' : 'btn-outline-dark'"
               th:text="${s}">Status</a>
            <div class="ms-auto">
                <a th:href="@{/admin/orders/export/csv}" class="btn btn-sm btn-outline-success">
                    <i class="bi bi-download me-1"></i>Export CSV
                </a>
            </div>
        </div>

        <table class="table table-hover mt-3">
            <thead class="table-dark">
                <tr><th>Code</th><th>Customer</th><th>Phone</th><th>Total</th><th>Status</th><th>Date</th><th>Actions</th></tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders.content}">
                    <td th:text="${order.orderCode}">Code</td>
                    <td th:text="${order.fullName}">Name</td>
                    <td th:text="${order.phone}">Phone</td>
                    <td th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'">Total</td>
                    <td>
                        <span class="badge"
                              th:classappend="${order.status.name() == 'PENDING'} ? 'bg-warning text-dark' :
                                              (${order.status.name() == 'CONFIRMED'} ? 'bg-info' :
                                              (${order.status.name() == 'SHIPPING'} ? 'bg-primary' :
                                              (${order.status.name() == 'DELIVERED'} ? 'bg-success' : 'bg-danger')))"
                              th:text="${order.status}">Status</span>
                    </td>
                    <td th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">Date</td>
                    <td>
                        <a th:href="@{/admin/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary">Details</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <p th:if="${orders.content.isEmpty()}" class="text-muted text-center mt-4">No orders found.</p>

        <!-- Pagination -->
        <nav th:if="${orders.totalPages > 1}" aria-label="Order pagination">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${orders.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/orders(page=${orders.number - 1}, status=${currentStatus != null ? currentStatus.name() : null})}">Previous</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}"
                    th:classappend="${i == orders.number} ? 'active'">
                    <a class="page-link" th:href="@{/admin/orders(page=${i}, status=${currentStatus != null ? currentStatus.name() : null})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${orders.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/orders(page=${orders.number + 1}, status=${currentStatus != null ? currentStatus.name() : null})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
