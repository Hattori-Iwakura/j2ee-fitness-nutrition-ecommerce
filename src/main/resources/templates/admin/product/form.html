<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Product Form - Admin')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <div class="flex-grow-1 p-4">
        <h2 th:text="${product.id != null} ? 'Edit Product' : 'New Product'">Product Form</h2>
        <div class="card mt-3">
            <div class="card-body">
                <form th:action="@{/admin/products/save}" th:object="${product}" method="post" enctype="multipart/form-data">
                    <input type="hidden" th:field="*{id}">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" th:field="*{name}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Slug</label>
                        <input type="text" class="form-control" th:field="*{slug}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Brand</label>
                        <input type="text" class="form-control" th:field="*{brand}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select class="form-select" name="categoryId" required>
                            <option value="">Select category</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                                    th:selected="${product.category != null and product.category.id == cat.id}">Category</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" rows="4" th:field="*{description}"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Product Image</label>
                        <input type="file" class="form-control" name="imageFile" accept="image/*">
                        <div th:if="${product.imageUrl != null}" class="mt-2">
                            <img th:src="${product.imageUrl}" alt="Current image" class="img-thumbnail" style="max-height: 150px;">
                            <small class="d-block text-muted">Current image. Upload a new file to replace it.</small>
                        </div>
                        <input type="hidden" th:field="*{imageUrl}">
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" th:field="*{active}" id="active">
                        <label class="form-check-label" for="active">Active</label>
                    </div>
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a th:href="@{/admin/products}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
