<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Products - Admin')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <div class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center">
            <h2>Products</h2>
            <a th:href="@{/admin/products/create}" class="btn btn-primary"><i class="bi bi-plus"></i> New Product</a>
        </div>
        <div th:if="${success}" class="alert alert-success mt-3" th:text="${success}"></div>
        <table class="table table-hover mt-3">
            <thead class="table-dark">
                <tr><th>ID</th><th>Name</th><th>Brand</th><th>Category</th><th>Variants</th><th>Active</th><th>Actions</th></tr>
            </thead>
            <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}">1</td>
                    <td th:text="${product.name}">Name</td>
                    <td th:text="${product.brand}">Brand</td>
                    <td th:text="${product.category.name}">Category</td>
                    <td th:text="${product.variants.size()}">0</td>
                    <td><span class="badge" th:classappend="${product.active} ? 'bg-success' : 'bg-secondary'" th:text="${product.active} ? 'Active' : 'Inactive'">Status</span></td>
                    <td>
                        <a th:href="@{/admin/products/edit/{id}(id=${product.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                        <a th:href="@{/admin/products/{id}/variants(id=${product.id})}" class="btn btn-sm btn-outline-info">Variants</a>
                        <form th:action="@{/admin/products/delete/{id}(id=${product.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Are you sure?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
