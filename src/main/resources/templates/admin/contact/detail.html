<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Message - Admin')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <div class="flex-grow-1 p-4">
        <a th:href="@{/admin/contact-messages}" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back</a>
        <h2>Message #<span th:text="${message.id}">1</span></h2>
        <div class="card mt-3">
            <div class="card-body">
                <p><strong>From:</strong> <span th:text="${message.fullName}"></span></p>
                <p><strong>Email:</strong> <span th:text="${message.email}"></span></p>
                <p th:if="${message.phone != null}"><strong>Phone:</strong> <span th:text="${message.phone}"></span></p>
                <p><strong>Date:</strong> <span th:text="${#temporals.format(message.createdAt, 'dd/MM/yyyy HH:mm')}"></span></p>
                <hr>
                <p class="mb-0" style="white-space: pre-wrap;" th:text="${message.message}"></p>
            </div>
        </div>
        <form th:action="@{/admin/contact-messages/{id}/delete(id=${message.id})}" method="post" class="mt-3"
              onsubmit="return confirm('Delete this message?')">
            <button type="submit" class="btn btn-outline-danger">Delete</button>
        </form>
    </div>
</div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
