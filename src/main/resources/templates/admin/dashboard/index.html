<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Admin Dashboard - FitShop')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <div class="flex-grow-1 p-4 fitshop-admin-main">
        <p class="fitshop-eyebrow mb-1" style="color: var(--fs-accent);">Admin</p>
        <h2 class="fitshop-section-title">Dashboard</h2>
        <div class="row g-4 mt-2">
            <div class="col-md-3">
                <div class="card text-white bg-primary fitshop-stat-card">
                    <div class="card-body">
                        <h6 class="card-title">Total Orders</h6>
                        <h2 th:text="${totalOrders}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-success fitshop-stat-card">
                    <div class="card-body">
                        <h6 class="card-title">Revenue</h6>
                        <h2 th:text="${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' VND'">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-info fitshop-stat-card">
                    <div class="card-body">
                        <h6 class="card-title">Products</h6>
                        <h2 th:text="${totalProducts}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-warning fitshop-stat-card text-dark">
                    <div class="card-body">
                        <h6 class="card-title">Users</h6>
                        <h2 th:text="${totalUsers}">0</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
