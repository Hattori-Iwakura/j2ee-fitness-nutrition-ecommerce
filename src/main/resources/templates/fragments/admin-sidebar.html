<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar" class="fitshop-admin-sidebar d-flex flex-column flex-shrink-0 p-3 text-white" style="width: 250px; min-height: calc(100vh - 56px);">
    <h5 class="mb-3"><i class="bi bi-gear-fill text-warning"></i> Admin Panel</h5>
    <hr>
    <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item">
            <a th:href="@{/admin}" class="nav-link text-white">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/admin/categories}" class="nav-link text-white">
                <i class="bi bi-tags"></i> Categories
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/admin/products}" class="nav-link text-white">
                <i class="bi bi-box"></i> Products
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/admin/orders}" class="nav-link text-white">
                <i class="bi bi-receipt"></i> Orders
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/admin/coupons}" class="nav-link text-white">
                <i class="bi bi-ticket-perforated"></i> Coupons
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/admin/users}" class="nav-link text-white">
                <i class="bi bi-people"></i> Users
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/admin/reviews}" class="nav-link text-white">
                <i class="bi bi-star"></i> Reviews
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/admin/banners}" class="nav-link text-white">
                <i class="bi bi-images"></i> Banners
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/admin/stock-logs}" class="nav-link text-white">
                <i class="bi bi-clock-history"></i> Stock log
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/admin/contact-messages}" class="nav-link text-white">
                <i class="bi bi-envelope"></i> Contact messages
            </a>
        </li>
        <li class="nav-item mt-3">
            <a th:href="@{/}" class="nav-link text-white-50">
                <i class="bi bi-arrow-left"></i> Back to Shop
            </a>
        </li>
    </ul>
</div>
</body>
</html>
