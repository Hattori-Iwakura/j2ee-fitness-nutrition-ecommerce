<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('My Wishlist - FitShop')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container mt-4">
    <h2><i class="bi bi-heart-fill text-danger"></i> My Wishlist</h2>

    <div th:if="${wishlistItems.isEmpty()}" class="text-center py-5">
        <i class="bi bi-heart display-1 text-muted"></i>
        <p class="text-muted fs-5 mt-3">Your wishlist is empty.</p>
        <a th:href="@{/products}" class="btn btn-primary">Browse Products</a>
    </div>

    <div class="row g-4" th:if="${!wishlistItems.isEmpty()}">
        <div class="col-md-4" th:each="item : ${wishlistItems}">
            <div class="card h-100 shadow-sm">
                <img th:if="${item.product.imageUrl != null}" th:src="${item.product.imageUrl}" class="card-img-top" style="height: 200px; object-fit: cover;" alt="Product image">
                <div th:if="${item.product.imageUrl == null}" class="text-center p-4 bg-light">
                    <i class="bi bi-box-seam display-4 text-muted"></i>
                </div>
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${item.product.name}">Product Name</h5>
                    <p class="text-muted small" th:text="${item.product.brand}">Brand</p>
                    <p class="fw-bold text-primary" th:if="${!item.product.variants.isEmpty()}"
                       th:text="'From ' + ${#numbers.formatDecimal(item.product.variants[0].price, 0, 'COMMA', 0, 'POINT')} + ' VND'">Price</p>
                    <div class="mt-auto d-flex gap-2">
                        <a th:href="@{/products/{slug}(slug=${item.product.slug})}" class="btn btn-outline-primary flex-grow-1">View Details</a>
                        <form th:action="@{/wishlist/remove}" method="post">
                            <input type="hidden" name="productId" th:value="${item.product.id}">
                            <button type="submit" class="btn btn-outline-danger" title="Remove from wishlist">
                                <i class="bi bi-heart-fill"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
