<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('My Wishlist - FitShop')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container fitshop-page">
    <p class="fitshop-eyebrow mb-1" style="color: var(--fs-accent);">Saved items</p>
    <h2 class="fitshop-section-title"><i class="bi bi-heart-fill text-danger me-2"></i>My wishlist</h2>

    <div th:if="${wishlistItems.isEmpty()}" class="fitshop-empty-state text-center">
        <i class="bi bi-heart display-1 text-muted"></i>
        <p class="text-muted fs-5 mt-3 mb-0">Your wishlist is empty.</p>
        <a th:href="@{/products}" class="btn btn-primary mt-3">Browse products</a>
    </div>

    <div class="row g-3 g-lg-4" th:if="${!wishlistItems.isEmpty()}">
        <div class="col-6 col-md-4" th:each="item : ${wishlistItems}">
            <div class="card h-100 fitshop-card border-0">
                <div class="fitshop-media fitshop-media--1x1">
                    <img th:if="${item.product.imageUrl != null}" th:src="${item.product.imageUrl}" th:alt="${item.product.name}" loading="lazy">
                    <div th:if="${item.product.imageUrl == null}" class="fitshop-placeholder-icon">
                        <i class="bi bi-box-seam display-4 text-muted"></i>
                    </div>
                </div>
                <div class="card-body d-flex flex-column px-3 pt-3 pb-2">
                    <h3 class="h6 card-title mb-1">
                        <a th:href="@{/products/{slug}(slug=${item.product.slug})}" class="fitshop-product-title-link" th:text="${item.product.name}">Product Name</a>
                    </h3>
                    <p class="text-muted small mb-2" th:text="${item.product.brand}">Brand</p>
                    <p class="fitshop-price-display fs-6 mb-3" th:if="${!item.product.variants.isEmpty()}"
                       th:text="'From ' + ${#numbers.formatDecimal(item.product.variants[0].price, 0, 'COMMA', 0, 'POINT')} + ' VND'">Price</p>
                    <div class="mt-auto d-flex gap-2 align-items-stretch">
                        <a th:href="@{/products/{slug}(slug=${item.product.slug})}" class="btn btn-outline-primary flex-grow-1">Details</a>
                        <form th:action="@{/wishlist/remove}" method="post" class="flex-shrink-0">
                            <input type="hidden" name="productId" th:value="${item.product.id}">
                            <button type="submit" class="btn btn-outline-danger h-100" title="Remove from wishlist">
                                <i class="bi bi-heart-fill"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
