<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('FitShop - Fitness & Nutrition Supplements')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container mt-5">
    <div class="text-center mb-5">
        <h1 class="display-4 fw-bold">Welcome to FitShop</h1>
        <p class="lead text-muted">Your one-stop shop for fitness & nutrition supplements</p>
        <a th:href="@{/products}" class="btn btn-primary btn-lg mt-3">Browse Products</a>
    </div>

    <div class="row g-4" th:if="${categories != null and !categories.isEmpty()}">
        <h2 class="text-center mb-3">Shop by Category</h2>
        <div class="col-md-4" th:each="category : ${categories}">
            <div class="card h-100 shadow-sm">
                <div class="card-body text-center">
                    <h5 class="card-title" th:text="${category.name}">Category</h5>
                    <p class="card-text text-muted" th:text="${category.description}">Description</p>
                    <a th:href="@{/products(category=${category.slug})}" class="btn btn-outline-primary">View Products</a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
