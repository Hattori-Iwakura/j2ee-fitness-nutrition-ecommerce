<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('FitShop - Fitness & Nutrition Supplements')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container mt-5">
    <div class="text-center mb-5">
        <h1 class="display-4 fw-bold">Welcome to FitShop</h1>
        <p class="lead text-muted">Your one-stop shop for fitness & nutrition supplements</p>
        <a th:href="@{/products}" class="btn btn-primary btn-lg mt-3">Browse Products</a>
    </div>

    <div class="row g-4" th:if="${categories != null and !categories.isEmpty()}">
        <h2 class="text-center mb-3">Shop by Category</h2>
        <div class="col-md-4" th:each="category : ${categories}">
            <div class="card h-100 shadow-sm">
                <img th:if="${category.imageUrl != null}" th:src="${category.imageUrl}" class="card-img-top" style="height: 180px; object-fit: cover;" alt="Category image">
                <div th:if="${category.imageUrl == null}" class="text-center p-4 bg-light">
                    <i class="bi bi-tags display-4 text-muted"></i>
                </div>
                <div class="card-body text-center">
                    <h5 class="card-title" th:text="${category.name}">Category</h5>
                    <p class="card-text text-muted" th:text="${category.description}">Description</p>
                    <a th:href="@{/products(category=${category.slug})}" class="btn btn-outline-primary">View Products</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Best Sellers -->
    <div class="mt-5" th:if="${bestSellers != null and !bestSellers.isEmpty()}">
        <h2 class="text-center mb-3">Best Sellers</h2>
        <div class="row row-cols-1 row-cols-md-4 g-3">
            <div class="col" th:each="product : ${bestSellers}">
                <div class="card h-100 shadow-sm">
                    <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}" class="card-img-top" style="height: 180px; object-fit: cover;" alt="Product image">
                    <div th:if="${product.imageUrl == null}" class="text-center p-4 bg-light" style="height: 180px; display: flex; align-items: center; justify-content: center;">
                        <i class="bi bi-box-seam display-4 text-muted"></i>
                    </div>
                    <div class="card-body">
                        <h6 class="card-title">
                            <a th:href="@{/products/{slug}(slug=${product.slug})}" class="text-decoration-none" th:text="${product.name}">Product</a>
                        </h6>
                        <small class="text-muted" th:text="${product.brand}">Brand</small>
                        <div class="mt-2" th:if="${!product.variants.isEmpty()}">
                            <strong class="text-primary" th:text="${#numbers.formatDecimal(product.variants[0].price, 0, 'COMMA', 0, 'POINT')} + ' VND'">Price</strong>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent text-center">
                        <a th:href="@{/products/{slug}(slug=${product.slug})}" class="btn btn-outline-primary btn-sm">View Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
