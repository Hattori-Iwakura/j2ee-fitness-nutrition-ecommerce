# Docker profile - overrides datasource to use container networking
spring.docker.compose.enabled=false
# Container listens on 8080; compose maps host 8082:8080 (same URL as local dev)
server.port=8080
spring.datasource.url=jdbc:mysql://mysql:3306/fitness_nutrition_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
